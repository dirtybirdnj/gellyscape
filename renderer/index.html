<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GellyScape - GeoPDF Processor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #06beb6 0%, #48b1bf 50%, #1e3a8a 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 1800px;
      height: calc(100vh - 20px);
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    h1 {
      color: #333;
      font-size: 1.2em;
      margin-bottom: 2px;
    }

    .subtitle {
      color: #666;
      font-size: 0.75em;
    }

    .upload-section {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin-bottom: 10px;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .upload-section.hidden {
      display: none;
    }

    .upload-section:hover {
      border-color: #764ba2;
      background-color: #f8f9ff;
    }

    .upload-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .upload-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .results {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .results.active {
      display: flex;
    }

    .section {
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .section.metadata-section {
      margin-bottom: 6px;
    }

    .map-container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 15px;
      margin-top: 10px;
      flex: 1;
      min-height: 0;
    }

    .layer-controls-panel {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 100%;
    }

    .layer-controls-title {
      font-size: 0.85em;
      color: #333;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 2px solid #667eea;
      flex-shrink: 0;
    }

    .layer-controls {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }

    .layer-item {
      margin-bottom: 4px;
      padding: 4px 6px;
      background: white;
      border-radius: 3px;
      border: 1px solid #e0e4ff;
      transition: background 0.2s;
    }

    .layer-item:hover {
      background: #f0f2ff;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-size: 0.8em;
      line-height: 1.2;
    }

    .checkbox-label input[type="checkbox"] {
      margin-right: 6px;
      cursor: pointer;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .export-section {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .layer-details-section {
      background: #fff5e6;
      border: 1px solid #ffe4b3;
      border-radius: 6px;
      padding: 8px;
      max-height: 300px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .layer-details-title {
      font-size: 0.85em;
      color: #333;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 2px solid #ff9800;
    }

    .layer-details {
      font-size: 0.75em;
    }

    .layer-detail-item {
      padding: 4px;
      margin-bottom: 2px;
      background: white;
      border-radius: 3px;
      border-left: 3px solid #ff9800;
    }

    .layer-detail-name {
      font-weight: 600;
      color: #333;
    }

    .layer-detail-info {
      color: #666;
      font-size: 0.9em;
    }

    .export-status {
      font-size: 0.85em;
      padding: 8px 12px;
      border-radius: 4px;
      display: none;
      transition: all 0.3s ease;
    }

    .export-status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .export-status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .export-status.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }

    .map-preview-panel {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .map-preview-title {
      font-size: 0.95em;
      color: #333;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid #667eea;
      flex-shrink: 0;
    }

    .map-preview {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }

    .map-preview.panning {
      cursor: grabbing;
    }

    .map-preview-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      position: relative;
    }

    .map-preview svg {
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      object-fit: contain;
    }

    .map-stats {
      margin-top: 8px;
      padding: 8px;
      background: white;
      border-radius: 4px;
      font-size: 0.8em;
      color: #666;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 0.9em;
      color: #333;
      margin-bottom: 4px;
      padding-bottom: 3px;
      border-bottom: 2px solid #667eea;
    }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .metadata-item {
      background: #f8f9ff;
      padding: 6px 8px;
      border-radius: 4px;
      border-left: 2px solid #667eea;
    }

    .metadata-label {
      font-weight: 600;
      color: #555;
      margin-bottom: 2px;
      font-size: 0.7em;
    }

    .metadata-value {
      color: #333;
      font-size: 0.8em;
    }

    .layer-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .layer-card {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 6px;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .layer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 12px rgba(102, 126, 234, 0.15);
    }

    .layer-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 1em;
    }

    .layer-info {
      margin-bottom: 12px;
    }

    .layer-info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.85em;
    }

    .layer-info-label {
      color: #666;
    }

    .layer-info-value {
      color: #333;
      font-weight: 500;
    }

    .layer-preview {
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
      background: white;
    }

    .export-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .export-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .geo-badge {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .no-data {
      text-align: center;
      color: #999;
      padding: 20px;
      font-style: italic;
      font-size: 0.9em;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .zoom-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 1px;
    }

    .zoom-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .zoom-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GellyScape</h1>
      <p class="subtitle">GeoPDF Layer Extraction & Processing</p>
    </header>

    <div class="upload-section">
      <h2 style="font-size: 1.2em; margin-bottom: 8px;">Upload GeoPDF File</h2>
      <p style="margin: 8px 0 12px 0; color: #666; font-size: 0.9em;">Select a GeoPDF file to extract raster and vector layers</p>
      <button id="uploadBtn" class="upload-btn">Choose PDF File</button>
      <div id="status" class="status"></div>
    </div>

    <div id="results" class="results">
      <!-- Metadata Section -->
      <div class="section metadata-section">
        <h2 class="section-title">Document Metadata</h2>
        <div id="metadata" class="metadata-grid"></div>
      </div>

      <!-- Map Preview and Layer Controls -->
      <div class="map-container">
        <div style="display: flex; flex-direction: column; gap: 8px; min-height: 0;">
          <!-- Layer Controls Panel -->
          <div class="layer-controls-panel">
            <h3 class="layer-controls-title">Layers</h3>
            <div id="layerControls" class="layer-controls"></div>
          </div>

          <!-- Export Section -->
          <div class="export-section">
            <label style="font-size: 0.8em; color: #333; margin-bottom: 4px; display: block;">
              Paper Size
            </label>
            <select id="paperSizeSelect" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ddd; margin-bottom: 8px; font-size: 0.85em;">
              <option value="original">Original Size</option>
              <option value="letter">Letter (8.5" × 11")</option>
              <option value="legal">Legal (8.5" × 14")</option>
              <option value="tabloid">Tabloid (11" × 17")</option>
              <option value="a4">A4 (210mm × 297mm)</option>
              <option value="a3">A3 (297mm × 420mm)</option>
              <option value="a2">A2 (420mm × 594mm)</option>
              <option value="a1">A1 (594mm × 841mm)</option>
              <option value="a0">A0 (841mm × 1189mm)</option>
            </select>
            <label class="checkbox-label">
              <input type="checkbox" id="whiteBackgroundCheck" checked>
              <span>White background</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="cropMaskCheck">
              <span>Show crop mask</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="skipWhiteFillsCheck" checked>
              <span>Skip white fills</span>
            </label>
            <button id="exportSvgBtn" class="export-btn">Export SVG</button>
            <div id="exportStatus" class="export-status"></div>
          </div>
        </div>

        <!-- Map Preview -->
        <div class="map-preview-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; min-width: 0;">
            <h3 class="map-preview-title" style="margin: 0; border: none; padding: 0; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Map Preview</h3>
            <div class="zoom-controls" style="flex-shrink: 0; margin-left: 8px;">
              <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out">−</button>
              <span id="zoomLevel" style="margin: 0 4px; font-size: 0.85em;">100%</span>
              <button id="zoomInBtn" class="zoom-btn" title="Zoom In">+</button>
              <button id="zoomResetBtn" class="zoom-btn" title="Reset Zoom">⟲</button>
            </div>
          </div>
          <div id="mapPreview" class="map-preview"></div>
          <div id="mapStats" class="map-stats"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
