<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GellyScape - GeoPDF Processor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #06beb6 0%, #48b1bf 50%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 1800px;
      padding: 20px;
      overflow-x: hidden;
    }

    .upload-section {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .upload-section:hover {
      border-color: #764ba2;
      background-color: #f8f9ff;
    }

    .upload-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .upload-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .results {
      display: none;
    }

    .section {
      margin-bottom: 15px;
    }

    .section.metadata-section {
      margin-bottom: 20px;
    }

    .map-container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .layer-controls-panel {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .layer-controls-title {
      font-size: 1em;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #667eea;
    }

    .layer-controls {
      margin-bottom: 20px;
    }

    .layer-item {
      margin-bottom: 8px;
      padding: 8px;
      background: white;
      border-radius: 4px;
      border: 1px solid #e0e4ff;
      transition: background 0.2s;
    }

    .layer-item:hover {
      background: #f0f2ff;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-size: 0.9em;
    }

    .checkbox-label input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    .export-section {
      padding-top: 15px;
      margin-top: 15px;
      border-top: 1px solid #e0e4ff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-preview-panel {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 8px;
      padding: 15px;
    }

    .map-preview-title {
      font-size: 1em;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #667eea;
    }

    .map-preview {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .map-preview svg {
      max-width: 100%;
      height: auto;
    }

    .map-stats {
      margin-top: 10px;
      padding: 10px;
      background: white;
      border-radius: 4px;
      font-size: 0.85em;
      color: #666;
    }

    .section-title {
      font-size: 1.1em;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #667eea;
    }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .metadata-item {
      background: #f8f9ff;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #667eea;
    }

    .metadata-label {
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      font-size: 0.85em;
    }

    .metadata-value {
      color: #333;
      font-size: 0.95em;
    }

    .layer-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .layer-card {
      background: #f8f9ff;
      border: 1px solid #e0e4ff;
      border-radius: 6px;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .layer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 12px rgba(102, 126, 234, 0.15);
    }

    .layer-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 1em;
    }

    .layer-info {
      margin-bottom: 12px;
    }

    .layer-info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.85em;
    }

    .layer-info-label {
      color: #666;
    }

    .layer-info-value {
      color: #333;
      font-weight: 500;
    }

    .layer-preview {
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
      background: white;
    }

    .export-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .export-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .geo-badge {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .no-data {
      text-align: center;
      color: #999;
      padding: 20px;
      font-style: italic;
      font-size: 0.9em;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .zoom-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 2px;
    }

    .zoom-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .zoom-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="upload-section">
      <h2 style="font-size: 1.2em; margin-bottom: 8px;">Upload GeoPDF File</h2>
      <p style="margin: 8px 0 12px 0; color: #666; font-size: 0.9em;">Select a GeoPDF file to extract raster and vector layers</p>
      <button id="uploadBtn" class="upload-btn">Choose PDF File</button>
      <div id="status" class="status"></div>
    </div>

    <div id="results" class="results">
      <!-- Metadata Section -->
      <div class="section metadata-section">
        <h2 class="section-title">Document Metadata</h2>
        <div id="metadata" class="metadata-grid"></div>
      </div>

      <!-- Map Preview and Layer Controls -->
      <div class="map-container">
        <!-- Layer Controls Panel -->
        <div class="layer-controls-panel">
          <h3 class="layer-controls-title">Layers</h3>
          <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button id="allLayersBtn" class="export-btn" style="font-size: 0.8em; padding: 6px 12px;">All</button>
            <button id="noneLayersBtn" class="export-btn" style="font-size: 0.8em; padding: 6px 12px;">None</button>
          </div>
          <div id="layerControls" class="layer-controls"></div>

          <div class="export-section">
            <label class="checkbox-label">
              <input type="checkbox" id="whiteBackgroundCheck" checked>
              <span>White background</span>
            </label>
            <button id="exportSvgBtn" class="export-btn">Export SVG</button>
            <button id="debugExportBtn" class="export-btn" style="background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);">Export Debug Data</button>
          </div>
        </div>

        <!-- Map Preview -->
        <div class="map-preview-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 class="map-preview-title" style="margin: 0;">Map Preview</h3>
            <div class="zoom-controls">
              <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out">−</button>
              <span id="zoomLevel" style="margin: 0 10px; font-size: 0.9em;">100%</span>
              <button id="zoomInBtn" class="zoom-btn" title="Zoom In">+</button>
              <button id="zoomResetBtn" class="zoom-btn" title="Reset Zoom">⟲</button>
            </div>
          </div>
          <div id="mapPreview" class="map-preview"></div>
          <div id="mapStats" class="map-stats"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
